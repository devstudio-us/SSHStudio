[package]
name = "sshstudio"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sshstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# File-system plugin. We use it ONLY from Rust (never grant the webview any
# `fs:` permission) so that reading a user-picked backup file works on Android:
# the picker returns a `content://` URI there, which `std::fs` can't open but
# this plugin resolves via Android's ContentResolver. On desktop it reads plain
# paths, so one code path covers every platform.
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
russh = "0.52"
russh-sftp = "2"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "io-util", "time"] }

# Desktop-only crates. The updater and process (relaunch) plugins and the
# `keyring` crate have no mobile backend, so they're excluded from Android/iOS
# builds; `secrets.rs` and `lib.rs` branch to mobile-safe code there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# OS keychain for saved host passwords (never written to the config files).
# Pure-Rust backends so Linux needs no extra system libs (dbus/openssl).
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
